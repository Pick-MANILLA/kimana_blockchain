name: Blockchain Security & Static Analysis

permissions:
  contents: read

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  # Slither runs in the `slither` job of ci.yml (test.yml), via crytic/slither-action with a pinned
  # version. Duplicating it here with an unpinned `pip install slither-analyzer` is what broke this
  # workflow: a later Slither release renamed `--fail-on medium` to `--fail-medium`. One pinned job.

  # 2. EVM Hardfork Compatibility Verification (Cancun vs Shanghai)
  evm-compatibility:
    name: EVM Hardfork Bytecode Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Dependencies
        run: make install

      - name: Compile with Cancun (Default)
        run: forge build --evm-version cancun --sizes

      - name: Compile with Shanghai (L2 Rollup Fallback)
        run: forge build --evm-version shanghai --sizes

      - name: Verify Contract Storage Layout Stability
        # The vault is not upgradeable, so a layout change is not a migration problem -- it is a
        # redeploy. This fails the build when a slot moves, so that is a decision someone makes on
        # purpose rather than something noticed after mainnet.
        run: |
          ./script/storage-layout.sh > /tmp/storage_layout.json
          echo "Current storage layout:"
          cat /tmp/storage_layout.json
          diff abi/SettlementVault.storage.json /tmp/storage_layout.json

  # 3. High-Depth Invariant & Fuzzing Suite
  fuzzing:
    name: Invariant & Deep Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Dependencies
        run: make install

      - name: Run Invariant & Fuzzing Suite
        run: forge test --match-path "test/invariant/*" -vvv
        env:
          FOUNDRY_FUZZ_RUNS: 5000
          FOUNDRY_INVARIANT_RUNS: 512
          FOUNDRY_INVARIANT_DEPTH: 100
